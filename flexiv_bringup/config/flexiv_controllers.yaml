controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    flexiv_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gpio_controller:
      type: gpio_controller/GPIOController

    flexiv_robot_states_broadcaster:
      type: flexiv_robot_states_broadcaster/FlexivRobotStatesBroadcaster

    cartesian_motion_force_controller:
      type: cartesian_motion_force_controller/CartesianMotionForceController

flexiv_arm_controller:
  ros__parameters:
    joints:
      - $(var robot_sn)_joint1
      - $(var robot_sn)_joint2
      - $(var robot_sn)_joint3
      - $(var robot_sn)_joint4
      - $(var robot_sn)_joint5
      - $(var robot_sn)_joint6
      - $(var robot_sn)_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # MoveIt Servo streams trajectories whose last point is still moving
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      # A goal fails unless every joint ends within its tolerance, so a robot that does not
      # follow, e.g. while the driver withholds motion, is reported instead of succeeding
      goal_time: 0.5
      $(var robot_sn)_joint1:
        goal: 0.05
      $(var robot_sn)_joint2:
        goal: 0.05
      $(var robot_sn)_joint3:
        goal: 0.05
      $(var robot_sn)_joint4:
        goal: 0.05
      $(var robot_sn)_joint5:
        goal: 0.05
      $(var robot_sn)_joint6:
        goal: 0.05
      $(var robot_sn)_joint7:
        goal: 0.05

flexiv_robot_states_broadcaster:
  ros__parameters:
    robot_sn: $(var robot_sn)

gpio_controller:
  ros__parameters:
    robot_sn: $(var robot_sn)

cartesian_motion_force_controller:
  ros__parameters:
    prefixes:
      - $(var robot_sn)_
