name: Humble Binary Build

on:
  push:
    branches:
      - humble
  pull_request:
    branches:
      - humble

jobs:
  humble_binary:
    name: Humble binary job
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    strategy:
      fail-fast: false
    env:
      ROS_DISTRO: humble
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libeigen3-dev \
          ros-humble-xacro \
          ros-humble-tinyxml2-vendor \
          ros-humble-ros2-control \
          ros-humble-realtime-tools \
          ros-humble-control-toolbox \
          ros-humble-moveit \
          ros-humble-ros2-controllers \
          ros-humble-test-msgs \
          ros-humble-joint-state-publisher \
          ros-humble-joint-state-publisher-gui \
          ros-humble-robot-state-publisher
      - name: Build and install flexiv_rdk
        shell: bash
        run: |
          cd flexiv_hardware/rdk/thirdparty
          bash build_and_install_dependencies.sh ~/rdk_install
          cd ..
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=~/rdk_install
          cmake --build . --target install --config Release
      - name: Build and run tests
        id: action-ros-ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ env.ROS_DISTRO }}
          vcs-repo-file-url: ${{ github.workspace }}/flexiv.humble.repos
          package-name: |
            flexiv_bringup
            flexiv_gripper
            flexiv_hardware
            flexiv_moveit_config
            flexiv_msgs
            flexiv_robot_states_broadcaster
            flexiv_test_nodes
            gpio_controller
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                    "-DCMAKE_PREFIX_PATH=~/rdk_install"
                ]
              }
            }
          skip-tests: true
