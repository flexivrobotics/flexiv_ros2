name: Humble Binary Build

on:
  push:
    branches:
      - humble-v1
      - humble
  pull_request:
    branches:
      - humble-v1
      - humble
      - release/humble-*

jobs:
  humble_binary:
    name: Humble binary job
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop
    strategy:
      fail-fast: false
    env:
      ROS_DISTRO: humble
      RDK_INSTALL_PREFIX: ${{ github.workspace }}/rdk_install
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          wget \
          libeigen3-dev \
          ros-humble-control-toolbox \
          ros-humble-hardware-interface \
          ros-humble-joint-state-publisher \
          ros-humble-joint-state-publisher-gui \
          ros-humble-moveit \
          ros-humble-realtime-tools \
          ros-humble-robot-state-publisher \
          ros-humble-ros2-control \
          ros-humble-ros2-controllers \
          ros-humble-rmw-cyclonedds-cpp \
          ros-humble-test-msgs \
          ros-humble-tinyxml2-vendor \
          ros-humble-xacro
      - name: Build and install flexiv_rdk
        shell: bash
        run: |
          git clone --branch v2.0 --depth 1 https://github.com/flexivrobotics/flexiv_rdk.git
          cd flexiv_rdk/thirdparty
          bash build_and_install_dependencies.sh "${RDK_INSTALL_PREFIX}"
          cd ..
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX="${RDK_INSTALL_PREFIX}"
          cmake --build . --target install --config Release
      - name: Verify flexiv_rdk install
        shell: bash
        run: |
          test -f "${RDK_INSTALL_PREFIX}/lib/cmake/flexiv_rdk/flexiv_rdk-config.cmake"
      - name: Build workspace
        id: action-ros-ci
        uses: ros-tooling/action-ros-ci@v0.4
        env:
          CMAKE_PREFIX_PATH: ${{ env.RDK_INSTALL_PREFIX }}
          RMW_IMPLEMENTATION: ${{ env.RMW_IMPLEMENTATION }}
        with:
          target-ros2-distro: ${{ env.ROS_DISTRO }}
          vcs-repo-file-url: ${{ github.workspace }}/flexiv.humble.repos
          package-name: |
            flexiv_bringup
            flexiv_gripper
            flexiv_hardware
            flexiv_moveit_config
            flexiv_msgs
            flexiv_robot_states_broadcaster
            flexiv_test_nodes
            gpio_controller
          extra-cmake-args: -DCMAKE_PREFIX_PATH=${{ env.RDK_INSTALL_PREFIX }}
          skip-tests: true
