name: Jazzy Binary Build

on:
  push:
    branches:
      - jazzy
  pull_request:
    branches:
      - jazzy

jobs:
  jazzy_binary:
    name: Jazzy binary job
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop
    strategy:
      fail-fast: false
    env:
      ROS_DISTRO: jazzy
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libeigen3-dev \
          ros-jazzy-xacro \
          ros-jazzy-tinyxml2-vendor \
          ros-jazzy-ros2-control \
          ros-jazzy-realtime-tools \
          ros-jazzy-control-toolbox \
          ros-jazzy-moveit \
          ros-jazzy-ros2-controllers \
          ros-jazzy-test-msgs \
          ros-jazzy-joint-state-publisher \
          ros-jazzy-joint-state-publisher-gui \
          ros-jazzy-robot-state-publisher
      - name: Build and install flexiv_rdk
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd flexiv_hardware/rdk
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=~/rdk_install -DRDK_SUPPORT_ROS2_JAZZY=ON
          make install
      - name: Build and run tests
        id: action-ros-ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ env.ROS_DISTRO }}
          package-name: |
            flexiv_bringup
            flexiv_description
            flexiv_gripper
            flexiv_hardware
            flexiv_moveit_config
            flexiv_msgs
            flexiv_robot_states_broadcaster
            flexiv_test_nodes
            gpio_controller
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                    "-DCMAKE_PREFIX_PATH=~/rdk_install"
                ]
              }
            }
          skip-tests: true
