name: Lyrical Binary Build

on:
  push:
    branches:
      - lyrical-v1
      - lyrical
  pull_request:
    branches:
      - lyrical-v1
      - lyrical
      - release/lyrical-*

jobs:
  lyrical_binary:
    name: Lyrical binary job
    runs-on: ubuntu-26.04
    container:
      image: osrf/ros:lyrical-desktop
    strategy:
      fail-fast: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ROS_DISTRO: lyrical
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
          wget \
          libeigen3-dev \
          ros-lyrical-control-toolbox \
          ros-lyrical-generate-parameter-library \
          ros-lyrical-hardware-interface \
          ros-lyrical-joint-state-publisher \
          ros-lyrical-joint-state-publisher-gui \
          ros-lyrical-moveit \
          ros-lyrical-realtime-tools \
          ros-lyrical-robot-state-publisher \
          ros-lyrical-ros2-control \
          ros-lyrical-ros2-controllers \
          ros-lyrical-test-msgs \
          ros-lyrical-tinyxml2-vendor \
          ros-lyrical-warehouse-ros-sqlite \
          ros-lyrical-xacro
      - name: Build and install flexiv_rdk
        shell: bash
        run: |
          git clone --branch release/v1.9.4 --depth 1 https://github.com/flexivrobotics/flexiv_rdk.git
          cd flexiv_rdk/thirdparty
          bash build_and_install_dependencies.sh ~/flexiv_install $(nproc)
          cd ..
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=~/flexiv_install
          cmake --build . --target install --config Release -j $(nproc)
      - name: Build and install flexiv_drdk
        shell: bash
        run: |
          git clone --branch release/v1.2.4 --depth 1 https://github.com/flexivrobotics/flexiv_drdk.git
          cd flexiv_drdk/thirdparty
          bash build_and_install_dependencies.sh ~/flexiv_install $(nproc) --skip-rdk
          cd ..
          mkdir -p build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=~/flexiv_install
          cmake --build . --target install --config Release -j $(nproc)
      - name: Build and run tests
        id: action-ros-ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: ${{ env.ROS_DISTRO }}
          coverage-result: false
          vcs-repo-file-url: ${{ github.workspace }}/flexiv.lyrical.repos
          package-name: |
            flexiv_bringup
            flexiv_calibration
            flexiv_gripper
            flexiv_hardware
            flexiv_moveit_config
            flexiv_msgs
            flexiv_robot_states_broadcaster
            flexiv_test_nodes
            gpio_controller
          colcon-defaults: |
            {
              "build": {
                "cmake-args": [
                    "-DCMAKE_PREFIX_PATH=~/flexiv_install"
                ]
              }
            }
