tcp_pose_state_broadcaster:
  frame_id:
    {
      type: string,
      default_value: "flange",
      description: "Sensor's frame_id in which values are published.",
      validation: { not_empty<>: null },
    }
  sensor_name:
    {
      type: string,
      default_value: "tcp_pose",
      description:
        "Name of the sensor used as prefix for interfaces if there are no individual interface names defined.
        If used, standard interface names for a 7D Cartesian pose will be used: ``<sensor_name>/position.x, ..., <sensor_name>/orientation.w``",
    }
  interface_names:
    position:
      x:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with position values on 'x' axis.",
        }
      y:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with position values on 'y' axis.",
        }
      z:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with position values on 'z' axis.",
        }
    orientation:
      x:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with quaternion value x.",
        }
      y:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with quaternion value y.",
        }
      z:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with quaternion value z.",
        }
      w:
        {
          type: string,
          default_value: "",
          description: "Name of the state interface with quaternion value w.",
        }
