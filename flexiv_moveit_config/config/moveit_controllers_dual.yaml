# Dual-arm (Enlight-LL, MICO-Core). One controller per arm, so each arm accepts and preempts
# trajectory goals independently; MoveIt splits a both_arms trajectory between them.
# MoveIt uses this configuration for controller management
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - left_flexiv_arm_controller
    - right_flexiv_arm_controller
    - left_flexiv_gripper_node
    - right_flexiv_gripper_node

  left_flexiv_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - left_$(var robot_sn)_joint1
      - left_$(var robot_sn)_joint2
      - left_$(var robot_sn)_joint3
      - left_$(var robot_sn)_joint4
      - left_$(var robot_sn)_joint5
      - left_$(var robot_sn)_joint6
      - left_$(var robot_sn)_joint7

  right_flexiv_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - right_$(var robot_sn)_joint1
      - right_$(var robot_sn)_joint2
      - right_$(var robot_sn)_joint3
      - right_$(var robot_sn)_joint4
      - right_$(var robot_sn)_joint5
      - right_$(var robot_sn)_joint6
      - right_$(var robot_sn)_joint7

  left_flexiv_gripper_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - left_$(var robot_sn)_finger_width_joint

  right_flexiv_gripper_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - right_$(var robot_sn)_finger_width_joint
