# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Position and velocity limits come from the URDF, which flexiv_description sets per robot type.
# The URDF has no acceleration limits, so they are added here for time parameterization.
# Joints that are not in the robot's URDF are ignored, so one file serves every robot type.
joint_limits:
  # Single-arm (Enlight-L)
  $(var robot_sn)_joint1:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint2:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint3:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint4:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint5:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint6:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_joint7:
    has_acceleration_limits: true
    max_acceleration: 5.0
  $(var robot_sn)_finger_width_joint:
    has_acceleration_limits: true
    max_acceleration: 1.0

  # Dual-arm (Enlight-LL, MICO-Core, MICO-Plus, MICO-Ultra)
  left_$(var robot_sn)_joint1:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint2:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint3:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint4:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint5:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint6:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_joint7:
    has_acceleration_limits: true
    max_acceleration: 5.0
  left_$(var robot_sn)_finger_width_joint:
    has_acceleration_limits: true
    max_acceleration: 1.0
  right_$(var robot_sn)_joint1:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint2:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint3:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint4:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint5:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint6:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_joint7:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_$(var robot_sn)_finger_width_joint:
    has_acceleration_limits: true
    max_acceleration: 1.0

  # 2-DoF torso (MICO-Plus, MICO-Ultra)
  $(var robot_sn)_torso_joint1:
    has_acceleration_limits: true
    max_acceleration: 1.0
  $(var robot_sn)_torso_joint2:
    has_acceleration_limits: true
    max_acceleration: 1.0
