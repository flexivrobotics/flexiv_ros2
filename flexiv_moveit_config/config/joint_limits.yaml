# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Position and velocity limits come from the URDF, which flexiv_description sets per robot type.
# MoveIt does not read the URDF 1.2 acceleration limits, so they are repeated here for time parameterization.
# This file is shared by every Rizon type, so each joint takes the lowest URDF acceleration among them
# (Rizon10's); the robot's own motion generator uses each joint's exact URDF value.
joint_limits:
  $(var prefix)joint1:
    has_acceleration_limits: true
    max_acceleration: 6.9812
  $(var prefix)joint2:
    has_acceleration_limits: true
    max_acceleration: 6.9812
  $(var prefix)joint3:
    has_acceleration_limits: true
    max_acceleration: 8.3776
  $(var prefix)joint4:
    has_acceleration_limits: true
    max_acceleration: 8.3776
  $(var prefix)joint5:
    has_acceleration_limits: true
    max_acceleration: 15.3588
  $(var prefix)joint6:
    has_acceleration_limits: true
    max_acceleration: 15.3588
  $(var prefix)joint7:
    has_acceleration_limits: true
    max_acceleration: 15.3588
  $(var prefix)finger_width_joint:
    has_acceleration_limits: true
    max_acceleration: 0.8
