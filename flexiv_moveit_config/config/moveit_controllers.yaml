# Single-arm (Enlight-L). Dual / MICO robots use moveit_controllers_dual.yaml /
# moveit_controllers_mico.yaml, selected by flexiv_moveit.launch.py based on robot_type.
# MoveIt uses this configuration for controller management
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false

trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_simple_controller_manager:
  controller_names:
    - flexiv_arm_controller
    - flexiv_gripper_node

  flexiv_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - $(var robot_sn)_joint1
      - $(var robot_sn)_joint2
      - $(var robot_sn)_joint3
      - $(var robot_sn)_joint4
      - $(var robot_sn)_joint5
      - $(var robot_sn)_joint6
      - $(var robot_sn)_joint7

  flexiv_gripper_node:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - $(var robot_sn)_finger_width_joint
