controller_names:
  - rizon_arm_controller
  - grav_gripper_controller

rizon_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7

grav_gripper_controller:
  action_ns: gripper_action
  type: GripperCommand
  default: true
  joints:
    - left_outer_knuckle_joint
