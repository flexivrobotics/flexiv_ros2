# Acceleration caps for the external axis joints, shared by AICO1 and AICO2;
# velocity limits come from the URDF. The axis name is the robot type
# lowercased with dashes as underscores (AICO2-10E-D1 -> aico2_10e_d1), so one
# pair of entries covers every model. Joints a given model does not have are
# simply not matched.
joint_limits:
  $(var external_axis_prefix)$(var external_axis_type)_joint1:
    has_acceleration_limits: true
    max_acceleration: 4.0
  $(var external_axis_prefix)$(var external_axis_type)_joint2:
    has_acceleration_limits: true
    max_acceleration: 4.0
