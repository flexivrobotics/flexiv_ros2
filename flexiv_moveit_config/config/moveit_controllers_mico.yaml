# MICO-Plus / MICO-Ultra. One 16-joint flexiv_arm_controller covers the two arms plus the 2-DoF
# torso (pan-tilt / waist). The arm planning groups (left_arm, right_arm, both_arms) command a
# joint subset via allow_partial_joints_goal (enabled controller-side).
controller_names:
  - flexiv_arm_controller
  - left_flexiv_gripper_node
  - right_flexiv_gripper_node

flexiv_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - left_$(var robot_sn)_joint1
    - left_$(var robot_sn)_joint2
    - left_$(var robot_sn)_joint3
    - left_$(var robot_sn)_joint4
    - left_$(var robot_sn)_joint5
    - left_$(var robot_sn)_joint6
    - left_$(var robot_sn)_joint7
    - right_$(var robot_sn)_joint1
    - right_$(var robot_sn)_joint2
    - right_$(var robot_sn)_joint3
    - right_$(var robot_sn)_joint4
    - right_$(var robot_sn)_joint5
    - right_$(var robot_sn)_joint6
    - right_$(var robot_sn)_joint7
    - $(var robot_sn)_torso_joint1
    - $(var robot_sn)_torso_joint2

left_flexiv_gripper_node:
  action_ns: gripper_action
  type: GripperCommand
  default: true
  joints:
    - left_$(var robot_sn)_finger_width_joint

right_flexiv_gripper_node:
  action_ns: gripper_action
  type: GripperCommand
  default: true
  joints:
    - right_$(var robot_sn)_finger_width_joint
